name: slate-nightly
on:
  schedule:
    - cron: "0 11 * * *"    # 7:00 AM ET  — grade yesterday, score today, file predictions
    - cron: "0 15 * * *"    # 11:00 AM ET — odds snapshot (openers)
    - cron: "30 22 * * *"   # 6:30 PM ET  — odds snapshot (east-coast closings)
    - cron: "30 1 * * *"    # 9:30 PM ET  — odds snapshot (west-coast closings)
  workflow_dispatch:

permissions:
  contents: write

concurrency: { group: slate, cancel-in-progress: false }

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pandas scikit-learn

      - name: Decide task from schedule
        id: task
        run: |
          if [ "${{ github.event.schedule }}" = "0 11 * * *" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "task=score" >> $GITHUB_OUTPUT
          else
            echo "task=odds" >> $GITHUB_OUTPUT
          fi

      - name: Capture odds snapshot
        if: steps.task.outputs.task == 'odds'
        env: { ODDS_API_KEY: "${{ secrets.ODDS_API_KEY }}" }
        run: python -m slate_lab.ledger capture-odds

      - name: Restore database cache
        if: steps.task.outputs.task == 'score'
        uses: actions/cache@v4
        with:
          path: slate.db
          key: slate-db-${{ github.run_id }}
          restore-keys: slate-db-

      - name: Bootstrap history (first run only)
        if: steps.task.outputs.task == 'score'
        shell: bash
        run: |
          python - << 'PY' || python -m slate_lab.ingest --db slate.db --seasons 2023 2024 2025
          import os, sqlite3, sys
          if not os.path.exists("slate.db"): sys.exit(1)
          n = sqlite3.connect("slate.db").execute("SELECT COUNT(*) FROM games").fetchone()[0]
          sys.exit(0 if n >= 2000 else 1)
          PY

      - name: Grade yesterday, score today, file predictions
        if: steps.task.outputs.task == 'score'
        run: |
          python -m slate_lab.ledger grade
          python -m slate_lab.score --db slate.db --update-season --out predictions.json
          python -m slate_lab.ledger record

      - name: Commit ledger (git history = tamper-evident timestamps)
        run: |
          git config user.name "slate-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/ || true
          git commit -m "ledger: ${{ steps.task.outputs.task }} $(date -u +%FT%TZ)" || echo "no changes"
          git push

      - name: Publish predictions + report to gh-pages
        if: steps.task.outputs.task == 'score'
        run: |
          git fetch origin gh-pages || true
          git checkout gh-pages 2>/dev/null || git checkout --orphan gh-pages
          git rm -rf --cached . 2>/dev/null || true
          cp predictions.json . 2>/dev/null || true
          cp data/report.json . 2>/dev/null || true
          git add predictions.json report.json 2>/dev/null || true
          git commit -m "publish $(date -u +%F)" || echo "no change"
          git push origin gh-pages
