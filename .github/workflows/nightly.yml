name: slate-nightly

on:
  schedule:
    - cron: "0 11 * * *"    # 7:00 AM ET  — MLB grade, score, file
    - cron: "0 15 * * *"    # 11:00 AM ET — MLB odds snapshot
    - cron: "30 22 * * *"   # 6:30 PM ET  — MLB odds snapshot
    - cron: "30 1 * * *"    # 9:30 PM ET  — MLB odds snapshot
    # ---- NFL (self-sleeping outside the regular season) ----
    - cron: "0 13 * * 3"    # Wed 9:00 AM ET  — file the week
    - cron: "0 13 * * 0"    # Sun 9:00 AM ET  — QB revisions + capture
    - cron: "0 12 * * 2"    # Tue 8:00 AM ET  — grade + report
    - cron: "0 21 * * 2"    # Tue 5:00 PM ET  — NFL odds capture (open)
    - cron: "0 21 * * 4"    # Thu 5:00 PM ET  — NFL odds capture
    - cron: "45 16 * * 0"   # Sun 12:45 PM ET — NFL odds capture (pre-kick)
    - cron: "0 23 * * 0"    # Sun 7:00 PM ET  — NFL odds capture
    - cron: "0 21 * * 1"    # Mon 5:00 PM ET  — NFL odds capture
  workflow_dispatch:
    inputs:
      task:
        description: "What to run"
        type: choice
        options: [score, odds, bootstrap-only]
        default: score

permissions:
  contents: write

concurrency:
  group: slate
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install --quiet pandas scikit-learn

      - name: Decide task
        id: t
        shell: bash
        run: |
          case "${{ github.event_name }}:${{ github.event.schedule }}" in
            workflow_dispatch:*) echo "task=${{ inputs.task }}" >> $GITHUB_OUTPUT ;;
            *:"0 11 * * *")  echo "task=score" >> $GITHUB_OUTPUT ;;
            *:"0 13 * * 3")  echo "task=nfl-file" >> $GITHUB_OUTPUT ;;
            *:"0 13 * * 0")  echo "task=nfl-sunday" >> $GITHUB_OUTPUT ;;
            *:"0 12 * * 2")  echo "task=nfl-grade" >> $GITHUB_OUTPUT ;;
            *:"0 21 * * 2"|*:"0 21 * * 4"|*:"45 16 * * 0"|*:"0 23 * * 0"|*:"0 21 * * 1")
                             echo "task=nfl-odds" >> $GITHUB_OUTPUT ;;
            *)               echo "task=odds" >> $GITHUB_OUTPUT ;;
          esac
          echo "Task: $(cat $GITHUB_OUTPUT)"

      # ---------------- odds path ----------------
      - name: Capture odds snapshot
        if: steps.t.outputs.task == 'odds'
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        shell: bash
        run: |
          if [ -z "$ODDS_API_KEY" ]; then
            echo "::error::ODDS_API_KEY secret is not set. Repo Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          python -m slate_lab.ledger capture-odds
          python -m slate_lab.ledger export-odds

      # ---------------- score path ----------------
      - name: Restore database cache
        if: steps.t.outputs.task != 'odds'
        uses: actions/cache@v4
        with:
          path: slate.db
          key: slate-db-v2-${{ github.run_id }}
          restore-keys: slate-db-v2-

      - name: Check whether history needs bootstrapping
        if: steps.t.outputs.task != 'odds'
        id: boot
        shell: bash
        run: |
          NEED=yes
          if [ -f slate.db ]; then
            N=$(python -c "import sqlite3;print(sqlite3.connect('slate.db').execute('SELECT COUNT(*) FROM games').fetchone()[0])" 2>/dev/null || echo 0)
            echo "Existing rows: $N"
            [ "$N" -ge 2000 ] && NEED=no
          fi
          echo "need=$NEED" >> $GITHUB_OUTPUT
          echo "Bootstrap needed: $NEED"

      - name: Bootstrap history (slow, first run only)
        if: steps.t.outputs.task != 'odds' && steps.boot.outputs.need == 'yes'
        run: python -m slate_lab.ingest --db slate.db --seasons 2023 2024 2025

      - name: Grade finished days
        if: steps.t.outputs.task == 'score'
        continue-on-error: true
        run: python -m slate_lab.ledger grade

      - name: Score today and file predictions
        if: steps.t.outputs.task == 'score'
        shell: bash
        run: |
          python -m slate_lab.score --db slate.db --update-season --out predictions.json
          python -m slate_lab.ledger record || echo "nothing to file"
          python -m slate_lab.ledger export-odds || echo "no odds yet"
          python -m slate_lab.props --db slate.db --project "$(date -u +%F)" --out props-mlb.json || echo "props skipped"
          echo "--- predictions.json ---"
          cat predictions.json

      # ---------------- persist ----------------
      - name: Commit ledger to main
        shell: bash
        run: |
          git config user.name  "slate-bot"
          git config user.email "slate-bot@users.noreply.github.com"
          if [ -d data ]; then git add -f data; fi
          if git diff --cached --quiet; then
            echo "No ledger changes."
          else
            git commit -m "ledger: ${{ steps.t.outputs.task }} $(date -u +%FT%TZ)"
            git pull --rebase --autostash origin main || true
            git push origin HEAD:main
          fi

      # ---------------- NFL paths (sleep outside regular season) ----------------
      - name: NFL season guard
        id: nflguard
        if: startsWith(steps.t.outputs.task, 'nfl-')
        shell: bash
        run: |
          python - << 'EOF' > guard.txt
          import sqlite3
          from slate_lab.sports import get_sport
          from slate_lab.nfl_ledger import upcoming_week
          from datetime import date
          sp = get_sport("nfl")
          con = sqlite3.connect("nfl.db")
          season = date.today().year if date.today().month >= 8 else date.today().year - 1
          sp.ingest(con, season)
          print("awake" if upcoming_week(con) else "asleep")
          EOF
          echo "state=$(tail -1 guard.txt)" >> $GITHUB_OUTPUT
          tail -1 guard.txt

      - name: NFL file week
        if: steps.t.outputs.task == 'nfl-file' && steps.nflguard.outputs.state == 'awake'
        run: python -m slate_lab.ledger record --sport nfl --db nfl.db

      - name: NFL Sunday revisions
        if: steps.t.outputs.task == 'nfl-sunday' && steps.nflguard.outputs.state == 'awake'
        run: python -m slate_lab.ledger revise --sport nfl --db nfl.db

      - name: NFL odds capture
        # unguarded on purpose: preseason odds are display-only and never
        # touch the ledger (filing/grading stay behind the season guard)
        if: steps.t.outputs.task == 'nfl-odds' || steps.t.outputs.task == 'nfl-sunday'
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          python -m slate_lab.ledger capture-odds --sport nfl
          python -m slate_lab.ledger export-odds --sport nfl --out nfl-odds.json || true

      - name: NFL grade
        if: steps.t.outputs.task == 'nfl-grade' && steps.nflguard.outputs.state == 'awake'
        run: python -m slate_lab.ledger grade --sport nfl --db nfl.db

      - name: Commit NFL ledger to main
        if: startsWith(steps.t.outputs.task, 'nfl-') && steps.nflguard.outputs.state == 'awake'
        shell: bash
        run: |
          git config user.name "slate-bot"; git config user.email "bot@slate"
          git add data/nfl 2>/dev/null || true
          git commit -m "nfl ledger: ${{ steps.t.outputs.task }}" || echo "nothing to commit"
          git push || (git pull --rebase origin main && git push)

      - name: Publish to gh-pages
        shell: bash
        run: |
          mkdir -p /tmp/pub
          [ -f predictions.json ] && cp predictions.json /tmp/pub/
          [ -f data/report.json ] && cp data/report.json /tmp/pub/
          [ -f odds.json ] && cp odds.json /tmp/pub/
          [ -f nfl-odds.json ] && cp nfl-odds.json /tmp/pub/
          [ -f props-mlb.json ] && cp props-mlb.json /tmp/pub/
          echo "published $(date -u +%FT%TZ)" > /tmp/pub/index.html
          rm -f predictions.json odds.json nfl-odds.json props-mlb.json
          git fetch origin gh-pages || true
          if git rev-parse --verify origin/gh-pages >/dev/null 2>&1; then
            git checkout -B gh-pages origin/gh-pages
          else
            git checkout --orphan gh-pages
            git rm -rf . >/dev/null 2>&1 || true
          fi
          cp /tmp/pub/* . 2>/dev/null || true
          git add -A -f index.html predictions.json report.json odds.json nfl-odds.json props-mlb.json 2>/dev/null || git add -A
          git commit --allow-empty -m "publish $(date -u +%FT%TZ)"
          git push origin gh-pages
